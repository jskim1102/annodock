server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Browser uploads use 4 MiB chunks. Keep a small margin for multipart
    # framing while avoiding an unnecessarily large per-request allowance.
    client_max_body_size 8m;

    # auth-service returns the browser here after provider login. This route is
    # owned by the SPA; the remaining /auth/* endpoints belong to auth-service.
    location = /auth/callback {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /auth/ {
        proxy_pass http://auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
